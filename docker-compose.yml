services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: elearning
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - elearning-network

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user-service
    depends_on:
      - postgres
    ports:
      - "8081:8081"
    networks:
      - elearning-network

  flashcard-service:
    build:
      context: ./flashcard-service
      dockerfile: Dockerfile
    container_name: flashcard-service
    depends_on:
      - postgres
    ports:
      - "8082:8082"
    networks:
      - elearning-network

  quiz-service:
    build:
      context: ./quiz-service
      dockerfile: Dockerfile
    container_name: quiz-service
    depends_on:
      - postgres
    ports:
      - "8083:8083"
    networks:
      - elearning-network

  group-service:
    build:
      context: ./group-service
      dockerfile: Dockerfile
    container_name: group-service
    depends_on:
      - postgres
    ports:
      - "8084:8084"
    networks:
      - elearning-network

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    depends_on:
      - user-service
      - flashcard-service
      - quiz-service
      - group-service
    ports:
      - "8080:8080"
    networks:
      - elearning-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3001:80"
    depends_on:
      - api-gateway
    networks:
      - elearning-network

networks:
  elearning-network:
    driver: bridge

volumes:
  postgres-data: 