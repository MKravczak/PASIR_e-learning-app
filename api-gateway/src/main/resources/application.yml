server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://user-service:8081
          predicates:
            - Path=/api/users/**
          filters:
            - RewritePath=/api/users/(?<segment>.*), /$\{segment}

        - id: flashcard-service
          uri: http://flashcard-service:8082
          predicates:
            - Path=/api/flashcards/**
          filters:
            - RewritePath=/api/flashcards/(?<segment>.*), /$\{segment}

        - id: quiz-service
          uri: http://quiz-service:8083
          predicates:
            - Path=/api/quizzes/**
          filters:
            - RewritePath=/api/quizzes/(?<segment>.*), /$\{segment}

        - id: group-service
          uri: http://group-service:8084
          predicates:
            - Path=/api/groups/**
          filters:
            - RewritePath=/api/groups/(?<segment>.*), /$\{segment}

# Konfiguracja JWT
jwt:
  secret: elearningSecretKeyVeryLongAndSecureKeyForJWTTokenGeneration 